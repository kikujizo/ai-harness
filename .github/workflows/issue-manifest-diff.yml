# Issue #122: PR実差分とIssue本文の固定manifestを機械照合し、独立レビュー前に
# manifest外・不足・入力不正をnonzeroで停止する。
#
# 権威ある判定はbase branch上のcheckerで行う（PR head側のプログラム・test・workflowは実行しない）。
#
# `pull_request_target`を使う（`pull_request`ではない）。GitHub Actionsの仕様上、
# `pull_request`はワークフローファイル自体がPRのmerge commit版（＝PR側の変更を含む版）で
# 実行されるため、PRがこの.ymlファイル自身を改変してcheckerの呼び出し・終了判定を
# 無力化できてしまう。`pull_request_target`はワークフローファイルをbase repositoryの
# default branch側から取得するため、PR側の.yml改変はこのジョブの実行内容に影響しない。
# （出典: https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target）
#
# `pull_request_target`はデフォルトで書き込み可能なGITHUB_TOKENを発行しうるため、
# 以下の不変条件を厳守する。
#   - PR headの内容は`git diff`比較のための「データ」としてのみ扱う（SHA値・tree比較）。
#   - PR head側のファイルを絶対に checkout / require / exec しない
#     （`Fetch PR head commit`はcommit objectをローカルの参照可能領域へ持ってくるだけで、
#     作業ツリーへは展開しない。これを変更する場合は必ずこの不変条件を再確認すること）
#   - `permissions:`を最小権限（read-only）に保つ。書き込み権限を追加しない
#
# branch protection設定自体は変更しない。fail/blockedは本Issueの運用契約上の
# レビュー・merge停止であり、GitHubの強制マージ阻止ではない。
#
# 「Related Issue: #<n>」行の抽出・検証はこのworkflowの責務。checker本体
# （harness/checks/issue-manifest-diff.cjs）はIssue番号を受け取るだけで、
# PR本文の形式は解釈しない。

name: Issue manifest diff

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-manifest-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (checker本体はPR headでなくbase側を使う)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head commit (checkoutはしない。tree比較のためのgit objectのみ取得)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "refs/pull/${PR_NUMBER}/head"

      - name: Extract "Related Issue" line from PR body
        id: related_issue
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          MATCH_COUNT="$(printf '%s\n' "${PR_BODY}" | grep -cE '^Related Issue: #[1-9][0-9]*$' || true)"

          if [[ "${MATCH_COUNT}" -eq 0 ]]; then
            {
              echo "ISSUE_MANIFEST_DIFF"
              echo "result=blocked"
              echo "stop_reason=related_issue_missing"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "${MATCH_COUNT}" -gt 1 ]]; then
            {
              echo "ISSUE_MANIFEST_DIFF"
              echo "result=blocked"
              echo "stop_reason=related_issue_ambiguous"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          ISSUE_NUMBER="$(printf '%s\n' "${PR_BODY}" | grep -E '^Related Issue: #[1-9][0-9]*$' | sed -E 's/^Related Issue: #//')"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run issue-manifest-diff checker (base branch上のcheckerをread-only実行)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.related_issue.outputs.issue_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node harness/checks/issue-manifest-diff.cjs \
            --repo "${TARGET_REPO}" \
            --issue "${ISSUE_NUMBER}" \
            --head "${HEAD_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
